[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rungrow-workforce-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","pydantic-settings>=2.5,<3","sqlalchemy[asyncio]>=2.0,<3","asyncpg>=0.29,<1","PyJWT>=2.9,<3","pwdlib[argon2]>=0.2,<1","httpx>=0.27,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<9","httpx>=0.27,<1","aiosqlite>=0.20,<1","pytest-asyncio>=0.24,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*"]
