[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rungrow-workforce-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","pydantic-settings>=2.5,<3","sqlalchemy[asyncio]>=2.0,<3","asyncpg>=0.29,<1","PyJWT[crypto]>=2.9,<3","pwdlib[argon2]>=0.2,<1","httpx>=0.27,<1","livekit-agents>=1.2,<2","livekit-api>=1.0,<2","PyYAML>=6.0,<7","Pillow>=10,<13","reportlab>=4,<5","openpyxl>=3.1,<4","beautifulsoup4>=4.12,<5"]
[project.optional-dependencies]
dev = ["pytest>=8,<9","httpx>=0.27,<1","aiosqlite>=0.20,<1","pytest-asyncio>=0.24,<1","playwright>=1.48,<2"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*"]
