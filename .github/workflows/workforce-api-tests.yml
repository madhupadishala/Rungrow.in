name: Workforce API Tests
on:
  pull_request:
    branches: [main, feat/ai-workforce-platform]
  push:
    branches: [feat/month-1-day-1-operating-foundation]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  workforce-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workforce-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: workforce-api/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q --junitxml=workforce-results.xml
