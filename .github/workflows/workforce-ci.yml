name: Workforce CI
on:
  push:
    branches: [main, feat/month-1-day-1-operating-foundation, feat/ai-workforce-platform, feat/workforce-2-orchestration]
  pull_request:
    branches: [main, feat/month-1-day-1-operating-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workforce-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workforce-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: rungrow_workforce_test
          POSTGRES_USER: rungrow_migrator
          POSTGRES_PASSWORD: rungrow_migrator_ci
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U rungrow_migrator -d rungrow_workforce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: workforce-api
    env:
      PGHOST: localhost
      PGPORT: 55439
      PGDATABASE: rungrow_workforce_test
      PGUSER: rungrow_migrator
      PGPASSWORD: rungrow_migrator_ci
      RUNGROW_APP_PASSWORD: rungrow_app_ci_only
      RUNGROW_TEST_DATABASE_URL: postgresql+asyncpg://rungrow_app_user:rungrow_app_ci_only@localhost:55439/rungrow_workforce_test
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: workforce-api/pyproject.toml
      - name: Install API and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Bootstrap schema_migrations and apply 001–010 with production checksum runner
        run: |
          # Runner package mirrors can transiently fail. Retry installation without
          # making PostgreSQL migration validation dependent on a single mirror request.
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y postgresql-client; then
              break
            fi
            if [[ "$attempt" == "3" ]]; then
              echo "Unable to install PostgreSQL client after 3 attempts" >&2
              exit 1
            fi
            sleep 8
          done
          mkdir -p /tmp/ci-bin
          cat > /tmp/ci-bin/docker <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == "compose" ]]; then shift; fi
          if [[ "${1:-}" == "-f" ]]; then shift 2; fi
          if [[ "${1:-}" == "exec" ]]; then
            shift
            [[ "${1:-}" == "-T" ]] && shift
            [[ "${1:-}" == "postgres" ]] && shift
            exec "$@"
          fi
          echo "Unsupported docker shim invocation: $*" >&2
          exit 2
          SH
          chmod +x /tmp/ci-bin/docker
          echo "/tmp/ci-bin" >> "$GITHUB_PATH"
          export PATH="/tmp/ci-bin:$PATH"
          bash ./scripts/init_test_db.sh
      - name: Run workforce API tests
        shell: bash
        run: |
          set +e
          pytest -v tests --junitxml=/tmp/workforce-pytest.xml
          test_exit=$?
          set -e
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          path = "/tmp/workforce-pytest.xml"
          if not os.path.exists(path):
              summary = "Pytest did not produce a JUnit report (collection or startup failure)."
              counts = {"tests": 0, "failures": 0, "errors": 1, "skipped": 0}
          else:
              root = ET.parse(path).getroot()
              suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
              counts = {key: sum(int(suite.attrib.get(key, 0)) for suite in suites)
                        for key in ("tests", "failures", "errors", "skipped")}
              summary = f"Tests: {counts['tests']} · Failed: {counts['failures']} · Errors: {counts['errors']} · Skipped: {counts['skipped']}"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("### Workforce API pytest\n\n" + summary + "\n")
          print(summary)
          if test_exit:
              raise SystemExit(test_exit)


  marketing-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify preserved static marketing entrypoint
        run: test -s index.html
      - name: Validate marketing scripts, manifests and API image
        shell: bash
        run: |
          set +e
          node --check workforce/scripts/workforce.js
          s1=$?
          node --check workforce/scripts/ceo.js
          s2=$?
          node -e "JSON.parse(require('fs').readFileSync('vercel.json', 'utf8'))"
          s3=$?
          python -m pip install pyyaml
          s4=$?
          if [[ "$s4" -eq 0 ]]; then
            python -c "import yaml; yaml.safe_load(open('render.yaml', encoding='utf-8'))"
            s5=$?
          else
            s5=1
          fi
          docker build --pull -f workforce-api/Dockerfile -t rungrow-workforce-api:ci .
          s6=$?
          set -e
          {
            echo "### Marketing-site validation"
            echo
            echo "| Check | Exit code |"
            echo "|---|---:|"
            echo "| workforce.js syntax | $s1 |"
            echo "| ceo.js syntax | $s2 |"
            echo "| vercel.json | $s3 |"
            echo "| PyYAML install | $s4 |"
            echo "| render.yaml | $s5 |"
            echo "| Workforce API Docker build | $s6 |"
          } >> "$GITHUB_STEP_SUMMARY"
          for code in "$s1" "$s2" "$s3" "$s4" "$s5" "$s6"; do
            [[ "$code" -eq 0 ]] || exit 1
          done
      - name: Build Next.js application when one exists
        if: hashFiles('package.json') != ''
        run: |
          npm ci
          npm run build
      - name: Typecheck Next.js application when a TypeScript config exists
        if: hashFiles('package.json', 'tsconfig.json') != ''
        run: npx tsc --noEmit
